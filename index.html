<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀リアルタイム・スコアボード</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        h1, h2 { text-align: center; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .container { grid-template-columns: 1fr 1fr; }
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        th { color: var(--text-secondary); }
    </style>
</head>
<body>

    <h1>🀄 麻雀リアルタイム・スコアボード</h1>

    <div class="container">
        <!-- スマホ用：点数入力パネル -->
        <div class="card">
            <h2>📝 点数入力</h2>
            <form id="score-form">
                <label>アガった人:</label>
                <select id="winner">
                    <option value="プレイヤー1">プレイヤー1</option>
                    <option value="プレイヤー2">プレイヤー2</option>
                    <option value="プレイヤー3">プレイヤー3</option>
                    <option value="プレイヤー4">プレイヤー4</option>
                </select>

                <label>アガリ方:</label>
                <select id="win-type">
                    <option value="ron">ロン</option>
                    <option value="tsumo">ツモ</option>
                </select>

                <label>点数（翻数・符など）:</label>
                <input type="number" id="points" placeholder="例: 7700 または 3900" required>

                <button type="submit">スコアを確定して送信！</button>
            </form>
            <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
            <button style="background-color: #ef4444;" onclick="resetData()">リセット</button>
        </div>

        <!-- パソコン用：もりもりレート・順位表示パネル -->
        <div class="card">
            <h2>🏆 リアルタイム順位表</h2>
            <table>
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>名前</th>
                        <th>トータルポイント</th>
                    </tr>
                </thead>
                <table id="ranking-table">
                    <!-- JavaScriptで動的に書き換え -->
                </table>
            </table>
        </div>
    </div>

    <script>
        // ローカルストレージを使った簡易同期（クラウド連携のベース）
        let players = [
            { name: "プレイヤー1", score: 25000 },
            { name: "プレイヤー2", score: 25000 },
            { name: "プレイヤー3", score: 25000 },
            { name: "プレイヤー4", score: 25000 }
        ];

        function updateDisplay() {
            const table = document.getElementById('ranking-table');
            // スコア順にソート
            players.sort((a, b) => b.score - a.score);

            let html = '';
            players.forEach((p, index) => {
                html += `<tr>
                    <td>${index + 1}位</td>
                    <td>${p.name}</td>
                    <td>${p.score.toLocaleString()} 点</td>
                </tr>`;
            });
            table.innerHTML = html;
        }

        document.getElementById('score-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const winner = document.getElementById('winner').value;
            const points = parseInt(document.getElementById('points').value) || 0;

            // 簡単な加算処理（実際はここに細かいロン・ツモのやり取りロジックが入る）
            players.forEach(p => {
                if (p.name === winner) {
                    p.score += points;
                } else {
                    p.score -= Math.floor(points / 3); // 簡易的な減点
                }
            });

            updateDisplay();
            alert(winner + ' の勝利を反映しました！');
            document.getElementById('points').value = '';
        });

        function resetData() {
            if(confirm('スコアを初期化しますか？')) {
                players.forEach(p => p.score = 25000);
                updateDisplay();
            }
        }

        // 初回ロード時
        updateDisplay();
    </script>

</body>
</html>
