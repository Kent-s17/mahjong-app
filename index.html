<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀リアルタイム・スコアボード（Gemini 3.5版）</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #10b981; --text-color: #f8fafc; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        .ai-result-box { background: #0f172a; border: 1px solid #10b981; padding: 12px; border-radius: 6px; margin: 10px 0; color: #34d399; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--card-bg); padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <div id="api-modal" class="modal" style="display: none;">
        <div class="modal-box">
            <h2>🔑 APIキー設定</h2>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <button onclick="saveApiKey()">保存して閉じる</button>
        </div>
    </div>

    <h1>🀄 麻雀リアルタイム・スコアボード</h1>
    <button class="secondary" onclick="document.getElementById('api-modal').style.display='flex'">APIキーを設定</button>

    <div class="container">
        <div class="card">
            <h2>✨ Gemini 自動点数計算</h2>
            <input type="file" accept="image/*" capture="environment" id="camera-input">
            <button id="ai-calc-btn" onclick="askGeminiToCalculate()">🤖 Gemini 3.5 で解析する！</button>
            <div id="ai-result-display" class="ai-result-box" style="display: none;">
                <span id="ai-detected-text">解析中...</span>
            </div>
            <input type="number" id="score" placeholder="点数">
            <button onclick="alert('スコア反映機能は既存のものと繋げてください')">スコアを反映する！</button>
        </div>
    </div>

    <script>
        let geminiApiKey = localStorage.getItem('mahjong_api_key') || '';

        function saveApiKey() {
            geminiApiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('mahjong_api_key', geminiApiKey);
            document.getElementById('api-modal').style.display = 'none';
        }

        async function askGeminiToCalculate() {
            if (!geminiApiKey) { alert("APIキーを設定してください"); return; }
            let fileInput = document.getElementById('camera-input');
            if (fileInput.files.length === 0) { alert("画像を選択してください"); return; }

            let btn = document.getElementById('ai-calc-btn');
            let detectedText = document.getElementById('ai-detected-text');
            document.getElementById('ai-result-display').style.display = 'block';
            
            btn.disabled = true;
            btn.innerText = "解析中...";

            try {
                let reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = async (e) => {
                    let base64Data = e.target.result.split(',')[1];
                    
                    // 最新の gemini-3.5-flash を指定
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "手牌画像を解析し、役、翻数、符数、点数をJSONで返してください。" },
                                    { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    if(data.error) throw new Error(data.error.message);
                    
                    let text = data.candidates[0].content.parts[0].text;
                    detectedText.innerText = text;
                    btn.disabled = false;
                    btn.innerText = "🤖 Gemini 3.5 で解析する！";
                };
            } catch (err) {
                detectedText.innerText = "エラー: " + err.message;
                btn.disabled = false;
                btn.innerText = "🤖 再試行する";
            }
        }
    </script>
</body>
</html>
