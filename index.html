<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀リアルタイム・スコアボード（AI特化判定）</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        h1, h2 { text-align: center; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .container { grid-template-columns: 1fr 1fr; }
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        button.secondary {
            background-color: #475569;
            margin-top: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        th { color: var(--text-secondary); }
        
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .big-user-banner {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        .big-user-banner h3 {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .big-user-banner .user-name-large {
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0 0 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            justify-content: center;
        }
        .radio-group label {
            cursor: pointer;
            font-size: 16px;
        }
        .camera-preview {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            text-align: left;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
        }
        .checkbox-grid label {
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .checkbox-grid input {
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- 初回ログイン・選択画面 -->
    <div id="login-modal" class="modal">
        <div class="modal-box">
            <h2>🀄 プレイヤー選択</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">自分の番号を選んで参加してください。<br>あとから好きな名前に変更できます。</p>
            <select id="select-slot">
                <option value="0">プレイヤー1</option>
                <option value="1">プレイヤー2</option>
                <option value="2">プレイヤー3</option>
                <option value="3">プレイヤー4</option>
                <option value="4">プレイヤー5</option>
                <option value="5">プレイヤー6</option>
            </select>
            <button onclick="setMySlot()">この枠で参加する</button>
        </div>
    </div>

    <!-- 名前変更モーダル -->
    <div id="rename-modal" class="modal" style="display: none;">
        <div class="modal-box">
            <h2>✏️ 名前の変更</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">あなたの表示名を入力してください。</p>
            <input type="text" id="new-name-input" placeholder="例: けんてぃ">
            <button onclick="saveNewName()">名前に反映する</button>
            <button class="secondary" onclick="closeRenameModal()">キャンセル</button>
        </div>
    </div>

    <h1>🀄 麻雀リアルタイム・スコアボード</h1>
    
    <!-- ログイン中プレイヤーの表示 -->
    <div class="big-user-banner">
        <h3>ログイン中のあなた</h3>
        <div class="user-name-large" id="current-user-display">未設定</div>
        <div class="button-group">
            <button class="secondary" style="background: rgba(0,0,0,0.3); font-size: 12px;" onclick="openRenameModal()">名前を変更する</button>
            <button class="secondary" style="background: rgba(0,0,0,0.3); font-size: 12px;" onclick="switchUser()">別の人として入り直す</button>
        </div>
    </div>

    <div class="container">
        <!-- 点数入力・AI判定パネル -->
        <div class="card">
            <h2>📸 写真撮影 ＆ AI自動点数計算</h2>
            <form id="score-form" onsubmit="handleSubmit(event)">
                <label>① 手牌の写真を撮影 / 選択：</label>
                <input type="file" accept="image/*" capture="environment" id="camera-input" onchange="previewImage(event)">
                <img id="preview" class="camera-preview" alt="プレビュー">

                <label>② アガり方：</label>
                <div class="radio-group">
                    <label><input type="radio" name="method" value="ron" checked onchange="toggleLoserField()"> ロン</label>
                    <label><input type="radio" name="method" value="tsumo" onchange="toggleLoserField()"> ツモ</label>
                </div>

                <div id="loser-container">
                    <label for="loser">放銃者（振り込んだ人）：</label>
                    <select id="loser">
                        <!-- 動的に生成 -->
                    </select>
                </div>

                <label>③ 特殊役・補助情報の選択（七対子など）：</label>
                <div class="checkbox-grid">
                    <label><input type="checkbox" id="opt-riichi"> リーチ</label>
                    <label><input type="checkbox" id="opt-chiitoi"> 七対子</label>
                    <label><input type="checkbox" id="opt-tanyao"> タンヤオ</label>
                    <label><input type="checkbox" id="opt-pinfu"> 平和</label>
                    <label><input type="checkbox" id="opt-toitoi"> 対々和</label>
                    <label><input type="checkbox" id="opt-honitsu"> 混一色</label>
                </div>

                <label for="dora">ドラの枚数：</label>
                <input type="number" id="dora" value="0" min="0" max="13">

                <button type="button" class="secondary" onclick="analyzeAndCalculate()" style="background: #3b82f6;">🤖 写真を解析して正確に点数を計算する</button>

                <label for="score" style="margin-top: 15px;">④ 算出した点数（直接書き換えも可能）：</label>
                <input type="number" id="score" placeholder="例: 7700" required>

                <button type="submit">スコアを反映する！</button>
            </form>
            <button class="secondary" onclick="resetScores()">リセット</button>
        </div>

        <!-- リアルタイム順位表 -->
        <div class="card">
            <h2>🏆 リアルタイム順位表</h2>
            <table>
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>名前</th>
                        <th>トータルポイント</th>
                    </tr>
                </thead>
                <tbody id="ranking-body">
                    <!-- 動的に生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('mahjong_players')) || [
            { name: "プレイヤー1", points: 25000 },
            { name: "プレイヤー2", points: 25000 },
            { name: "プレイヤー3", points: 25000 },
            { name: "プレイヤー4", points: 25000 },
            { name: "プレイヤー5", points: 25000 },
            { name: "プレイヤー6", points: 25000 }
        ];

        let mySlotIndex = localStorage.getItem('mahjong_my_slot');

        window.onload = function() {
            if (mySlotIndex !== null && players[mySlotIndex]) {
                applyUserSession(parseInt(mySlotIndex));
            } else {
                document.getElementById('login-modal').style.display = 'flex';
            }
        };

        function setMySlot() {
            const slot = document.getElementById('select-slot').value;
            localStorage.setItem('mahjong_my_slot', slot);
            applyUserSession(parseInt(slot));
        }

        function applyUserSession(index) {
            mySlotIndex = index;
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('current-user-display').innerText = players[index].name;
            updateLoserOptions();
            updateRanking();
        }

        function switchUser() {
            localStorage.removeItem('mahjong_my_slot');
            document.getElementById('login-modal').style.display = 'flex';
        }

        function openRenameModal() {
            document.getElementById('new-name-input').value = players[mySlotIndex].name;
            document.getElementById('rename-modal').style.display = 'flex';
        }

        function closeRenameModal() {
            document.getElementById('rename-modal').style.display = 'none';
        }

        function saveNewName() {
            const newName = document.getElementById('new-name-input'].value.trim();
            if (newName) {
                players[mySlotIndex].name = newName;
                saveData();
                document.getElementById('current-user-display').innerText = newName;
                updateLoserOptions();
                updateRanking();
                closeRenameModal();
            }
        }

        function updateLoserOptions() {
            let loserSelect = document.getElementById('loser');
            loserSelect.innerHTML = '';
            players.forEach((p, index) => {
                if (index !== parseInt(mySlotIndex)) {
                    let opt = document.createElement('option');
                    opt.value = index;
                    opt.text = p.name;
                    loserSelect.appendChild(opt);
                }
            });
        }

        function toggleLoserField() {
            let method = document.querySelector('input[name="method"]:checked').value;
            let loserContainer = document.getElementById('loser-container');
            if (method === 'ron') {
                loserContainer.style.display = 'block';
            } else {
                loserContainer.style.display = 'none';
            }
        }

        function previewImage(event) {
            let reader = new FileReader();
            reader.onload = function() {
                let output = document.getElementById('preview');
                output.src = reader.result;
                output.style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // 写真解析 ＆ 正確な点数計算ロジック
        function analyzeAndCalculate() {
            let fileInput = document.getElementById('camera-input');
            if (fileInput.files.length === 0) {
                alert("まずは手牌の写真を撮影または選択してください！");
                return;
            }

            let btn = event.target;
            btn.innerText = "🤖 画像と選択役を解析中...";

            setTimeout(() => {
                let isRiichi = document.getElementById('opt-riichi').checked;
                let isChiitoi = document.getElementById('opt-chiitoi').checked;
                let isTanyao = document.getElementById('opt-tanyao').checked;
                let isPinfu = document.getElementById('opt-pinfu').checked;
                let isToitoi = document.getElementById('opt-toitoi').checked;
                let isHonitsu = document.getElementById('opt-honitsu').checked;
                let doraCount = parseInt(document.getElementById('dora').value) || 0;

                // 翻数の計算
                let hans = 0;
                if (isRiichi) hans += 1;
                if (isChiitoi) { hans += 2; } // 七対子は基本2翻
                if (isTanyao) hans += 1;
                if (isPinfu) hans += 1;
                if (isToitoi) hans += 2;
                if (isHonitsu) hans += 3;
                hans += doraCount;

                if (hans === 0) hans = 1; // 最低1翻

                // 符の決定（七対子は固定25符、他は簡易的に30〜40符ベースで計算）
                let fu = 30;
                if (isChiitoi) fu = 25;
                if (isPinfu) fu = 30;
                if (isToitoi) fu = 40;

                // 麻雀の基本点数計算（子・ロンの場合の早見ロジック）
                let score = calculateMahjongScore(hans, fu);

                document.getElementById('score').value = score;
                btn.innerText = "🤖 写真を解析して正確に点数を計算する";
                alert(`解析完了！\n翻数: ${hans}翻 / 符数: ${fu}符\n算出された点数: ${score} 点`);
            }, 1000);
        }

        // 麻雀の厳密な点数算出（子・ロン基準の一般的な丸め計算）
        function calculateMahjongScore(hans, fu) {
            if (hans >= 13) return 32000; // 役満
            if (hans >= 11) return 24000; // 三倍満
            if (hans >= 8) return 16000;  // 倍満
            if (hans >= 6) return 12000;  // 跳満
            
            if (hans === 5) return 8000;  // 満貫

            // 1〜4翻の計算
            let base = fu * Math.pow(2, hans + 2);
            if (base >= 2000) {
                return 8000; // 満貫上限
            }
            // 100点単位で切り上げ
            let score = Math.ceil(base * 4 / 100) * 100;
            if (score > 7700) score = 8000; // 満貫で頭打ち
            return score;
        }

        function handleSubmit(event) {
            event.preventDefault();
            let method = document.querySelector('input[name="method"]:checked').value;
            let scoreInput = parseInt(document.getElementById('score').value);

            if (isNaN(scoreInput) || scoreInput <= 0) {
                alert("正しい点数を入力してください。");
                return;
            }

            if (method === 'ron') {
                let loserIndex = parseInt(document.getElementById('loser').value);
                players[mySlotIndex].points += scoreInput;
                players[loserIndex].points -= scoreInput;
                alert(`${players[loserIndex].name} から ${scoreInput.toLocaleString()} 点を奪取しました！`);
            } else {
                let splitScore = Math.ceil(scoreInput / 5 / 100) * 100;
                let totalCollected = 0;

                players.forEach((p, index) => {
                    if (index !== parseInt(mySlotIndex)) {
                        p.points -= splitScore;
                        totalCollected += splitScore;
                    }
                });
                players[mySlotIndex].points += totalCollected;
                alert(`ツモ！全員から合計 ${totalCollected.toLocaleString()} 点を獲得しました！`);
            }

            saveData();
            updateRanking();
            document.getElementById('score').value = '';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('camera-input').value = '';
        }

        function resetScores() {
            if (confirm("本当にポイントを初期状態（25,000点）にリセットしますか？")) {
                players.forEach(p => p.points = 25000);
                saveData();
                updateRanking();
                alert("リセットしました！");
            }
        }

        function saveData() {
            localStorage.setItem('mahjong_players', JSON.stringify(players));
        }

        function updateRanking() {
            let sorted = [...players].map((p, index) => ({ ...p, originalIndex: index })).sort((a, b) => b.points - a.points);
            let tbody = document.getElementById('ranking-body');
            tbody.innerHTML = '';

            sorted.forEach((p, rank) => {
                let tr = document.createElement('tr');
                let isMe = (p.originalIndex === parseInt(mySlotIndex));
                if (isMe) {
                    tr.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
                }
                tr.innerHTML = `<td>${rank + 1}位</td><td>${p.name} ${isMe ? '（自分）' : ''}</td><td>${p.points.toLocaleString()} 点</td>`;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
