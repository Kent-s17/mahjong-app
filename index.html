<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀リアルタイム・スコアボード (6人レート・4人打ち対応)</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #10b981; --text-color: #f8fafc; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        select, input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: center; }
        .radio-group { display: flex; gap: 20px; justify-content: center; margin: 15px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>✨ 麻雀点数記録</h2>
    <div class="radio-group">
        <label><input type="radio" name="method" value="ron" checked onchange="updateFormOptions()"> ロン</label>
        <label><input type="radio" name="method" value="tsumo" onchange="updateFormOptions()"> ツモ</label>
    </div>

    <label>👑 親は誰？</label>
    <select id="dealer-select"></select>

    <div id="ron-fields">
        <label>放銃者（振り込んだ人）</label>
        <select id="loser-select"></select>
    </div>

    <div id="tsumo-fields" style="display:none;">
        <label>👥 ツモられた相手（3人）</label>
        <select id="victim1"></select>
        <select id="victim2"></select>
        <select id="victim3"></select>
    </div>

    <label>点数</label>
    <input type="number" id="score" placeholder="例: 8000">
    <button onclick="handleSubmit()">スコアを反映</button>
</div>

<div class="card">
    <h2>🏆 6人全体ランキング</h2>
    <table>
        <thead><tr><th>順位</th><th>名前</th><th>点数</th></tr></thead>
        <tbody id="ranking-body"></tbody>
    </table>
</div>

<script>
    let players = JSON.parse(localStorage.getItem('mahjong_6p_all')) || 
        Array.from({length: 6}, (_, i) => ({ name: `プレイヤー${i+1}`, points: 25000 }));
    let mySlot = parseInt(localStorage.getItem('mahjong_my_slot_6p') || 0);

    function updateFormOptions() {
        const method = document.querySelector('input[name="method"]:checked').value;
        document.getElementById('ron-fields').style.display = method === 'ron' ? 'block' : 'none';
        document.getElementById('tsumo-fields').style.display = method === 'tsumo' ? 'block' : 'none';

        // セレクトボックス更新
        const selects = ['dealer-select', 'loser-select', 'victim1', 'victim2', 'victim3'];
        selects.forEach(id => {
            let el = document.getElementById(id);
            el.innerHTML = players.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
        });
    }

    function handleSubmit() {
        const method = document.querySelector('input[name="method"]:checked').value;
        const dealer = parseInt(document.getElementById('dealer-select').value);
        let score = parseInt(document.getElementById('score').value);
        
        // 親なら1.5倍の点数に補正（ロンの場合の親アガリ対応）
        if (mySlot === dealer && method === 'ron') score = Math.floor(score * 1.5 / 100) * 100;

        if (method === 'ron') {
            const loser = parseInt(document.getElementById('loser-select').value);
            players[mySlot].points += score;
            players[loser].points -= score;
        } else {
            const victims = [parseInt(document.getElementById('victim1').value), parseInt(document.getElementById('victim2').value), parseInt(document.getElementById('victim3').value)];
            let totalPaid = 0;
            victims.forEach(v => {
                let pay = (v === dealer) ? Math.ceil((score * 0.5) / 100) * 100 : Math.ceil((score * 0.25) / 100) * 100;
                players[v].points -= pay;
                totalPaid += pay;
            });
            players[mySlot].points += totalPaid;
        }

        localStorage.setItem('mahjong_6p_all', JSON.stringify(players));
        updateRanking();
        alert("反映しました！");
    }

    function updateRanking() {
        let sorted = [...players].sort((a, b) => b.points - a.points);
        document.getElementById('ranking-body').innerHTML = sorted.map((p, i) => 
            `<tr><td>${i+1}位</td><td>${p.name}</td><td>${p.points.toLocaleString()}</td></tr>`).join('');
    }

    updateFormOptions();
    updateRanking();
</script>
</body>
</html>
